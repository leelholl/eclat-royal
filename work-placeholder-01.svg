<?xml version="1.0" encoding="UTF-8"?>
<!-- Cadre vectoriel simple : ouvrez dans Illustrator, importez la photo,
     placez-la sous la forme puis utilisez la forme comme masque d'écrêtage. -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850">
  <title>Cadre photo vertical à remplacer</title>
  <rect id="cadre-photo" x="8" y="8" width="744" height="834" rx="3" fill="#f3efe7" stroke="#b89a67" stroke-width="2"/>
</svg>
